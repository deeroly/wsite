<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Life Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="eyebrow">PRIVATE SPACE</div>
      <h1>Life Calendar</h1>
      <p class="login-subtitle">Enter your password to continue.</p>
      <form id="loginForm" class="login-form" autocomplete="off">
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Password" autofocus>
        <button type="submit" id="loginBtn">Send</button>
      </form>
      <div id="loginMessage" class="login-message" aria-live="polite"></div>
    </div>
  </div>

  <div id="appScreen" class="app-hidden">
    <header class="topbar">
      <div class="topbar-top">
        <div>
          <div class="eyebrow">PERSONAL TRACKER</div>
          <h1>Life Calendar</h1>
        </div>
        <div class="header-actions">
          <div class="today-pill" id="todayPill"></div>
          <span id="saveStatus" class="save-status"></span>
          <button id="savePageBtn" class="save-page-btn">Save page</button>
          <button id="logoutBtn" class="logout-btn">Log out</button>
        </div>
      </div>
      <div class="profile-picker" id="profilePicker">
        <button class="profile-circle" data-profile="G">G</button>
        <button class="profile-circle" data-profile="D">D</button>
        <button class="profile-circle" data-profile="K">K</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="calendar-column">
        <section id="overduePanel" class="overdue-panel"></section>
        <div id="calendar"></div>
        <section id="selectedDayPanel" class="selected-panel hidden"></section>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
